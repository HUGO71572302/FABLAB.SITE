<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Machines — FabLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold">Parc machines</h1>
    <p class="text-stone-600 mt-1">Statut, catégorie et niveau requis. Touche une fiche pour les règles et les créneaux.</p>
    <p id="err" class="hidden mt-3"></p>
    <div id="grid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script type="module">
    import { supabase, supabaseReady, getSession, renderNav, bindNav, requireConfigBanner, machineCard, toast, layoutShell } from "./js/app.js";
    requireConfigBanner();
    const { user, profile } = await getSession();
    document.getElementById("nav").innerHTML = renderNav("machines", { user, profile });
    document.getElementById("footer").innerHTML = layoutShell();
    bindNav();
    if (!supabaseReady) return;
    const { data, error } = await supabase.from("machines").select("*").order("name");
    if (error) toast(document.getElementById("err"), error.message);
    else document.getElementById("grid").innerHTML = (data || []).map(machineCard).join("");
  </script>
</body>
</html>
