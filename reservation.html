<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réserver — FabLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">
  <div id="nav"></div>
  <main class="max-w-lg mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold">Nouvelle réservation</h1>
    <p id="msg" class="hidden mt-3"></p>
    <form id="form" class="mt-6 space-y-4 bg-white border border-stone-200 rounded-2xl p-5">
      <label class="block text-sm font-medium">Machine
        <select id="machine" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5"></select>
      </label>
      <label class="block text-sm font-medium">Date
        <input type="date" id="date" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5" />
      </label>
      <label class="block text-sm font-medium">Créneau
        <select id="slot" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5"></select>
      </label>
      <p id="hours" class="text-xs text-stone-500"></p>
      <label class="block text-sm font-medium">Objectif de la séance
        <textarea id="goal" required minlength="8" rows="3" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2.5" placeholder="Ex. : découpe d’un boîtier en MDF 3 mm"></textarea>
      </label>
      <label class="flex items-start gap-2 text-sm">
        <input type="checkbox" id="safety" required class="mt-1 h-4 w-4" />
        <span>J’ai lu et j’accepte les règles de sécurité de cette machine.</span>
      </label>
      <div id="rules" class="text-xs text-stone-600 bg-orange-50 border border-orange-100 rounded-lg p-3 whitespace-pre-line"></div>
      <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg">Envoyer la demande</button>
    </form>
  </main>
  <div id="footer"></div>
  <script src="js/config.js"></script>
  <script type="module">
    import {
      supabase, supabaseReady, getSession, renderNav, bindNav, requireConfigBanner,
      toast, layoutShell, slotsForDay, OPENING, overlaps, escapeHtml
    } from "./js/app.js";
    requireConfigBanner();
    const { user, profile } = await getSession();
    document.getElementById("nav").innerHTML = renderNav("resa", { user, profile });
    document.getElementById("footer").innerHTML = layoutShell();
    bindNav();
    const msg = document.getElementById("msg");
    if (!user) {
      location.href = "connexion.html";
    } else if (!supabaseReady) {
      toast(msg, "Configure js/config.js");
    } else {
      const { data: machines, error } = await supabase.from("machines").select("*").eq("status", "disponible").order("name");
      if (error) toast(msg, error.message);
      const sel = document.getElementById("machine");
      const pre = new URLSearchParams(location.search).get("machine");
      sel.innerHTML = (machines || []).map((m) => `<option value="${m.id}" ${m.id === pre ? "selected" : ""}>${escapeHtml(m.name)} (${m.max_duration_minutes} min max)</option>`).join("");
      const dateEl = document.getElementById("date");
      const today = new Date();
      dateEl.min = today.toISOString().slice(0, 10);
      dateEl.value = dateEl.min;

      const machinesById = Object.fromEntries((machines || []).map((m) => [m.id, m]));

      async function refreshSlots() {
        const m = machinesById[sel.value];
        document.getElementById("rules").textContent = m?.safety_rules || "";
        const d = new Date(dateEl.value + "T12:00:00");
        const oh = OPENING[d.getDay()];
        document.getElementById("hours").textContent = oh
          ? `Ouvert ${String(oh.start).padStart(2, "0")}:00–${String(oh.end).padStart(2, "0")}:00`
          : "Fermé ce jour-là.";
        const slotEl = document.getElementById("slot");
        if (!m || !oh) {
          slotEl.innerHTML = "<option value=''>Aucun créneau</option>";
          return;
        }
        const from = new Date(d);
        from.setHours(0, 0, 0, 0);
        const to = new Date(from);
        to.setDate(to.getDate() + 1);
        const { data: busy } = await supabase
          .from("reservation_slots")
          .select("start_time,end_time")
          .eq("machine_id", m.id)
          .in("status", ["en_attente", "confirmee"])
          .gte("end_time", from.toISOString())
          .lt("start_time", to.toISOString());
        const now = Date.now();
        const free = slotsForDay(d, m.max_duration_minutes).filter((s) => {
          if (s.start.getTime() < now) return false;
          return !(busy || []).some((b) => overlaps(s.start, s.end, new Date(b.start_time), new Date(b.end_time)));
        });
        slotEl.innerHTML = free.length
          ? free
              .map(
                (s) =>
                  `<option value="${s.start.toISOString()}|${s.end.toISOString()}">${s.start.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} – ${s.end.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</option>`
              )
              .join("")
          : "<option value=''>Aucun créneau libre</option>";
      }
      sel.onchange = refreshSlots;
      dateEl.onchange = refreshSlots;
      await refreshSlots();

      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const slot = document.getElementById("slot").value;
        if (!slot) return toast(msg, "Choisis un créneau.");
        const [start_time, end_time] = slot.split("|");
        const { error: insErr } = await supabase.from("reservations").insert({
          user_id: user.id,
          machine_id: sel.value,
          start_time,
          end_time,
          goal: document.getElementById("goal").value.trim(),
          status: "en_attente"
        });
        if (insErr) {
          const overlap = /exclusion|overlap|23P01|reservations_no_overlap/i.test(insErr.message + insErr.code);
          toast(msg, overlap ? "Ce créneau chevauche une réservation existante (bloqué en base)." : insErr.message);
          await refreshSlots();
          return;
        }
        toast(msg, "Demande envoyée. Un FabManager va la valider.", true);
        setTimeout(() => (location.href = "mes-reservations.html"), 800);
      };
    }
  </script>
</body>
</html>
