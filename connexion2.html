<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | FabLab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo"><span class="logo-dot"></span>FabLab</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="catalogue.html">Machines</a>
            <a href="apropos.html">À propos</a>
            <a href="connexion.html" class="active">Connexion</a>
            <a href="reservation.html" class="nav-cta">Réserver</a>
        </nav>
    </header>

    <main>

        <section id="auth-section">

            <div class="auth-box">

                <div class="auth-header">
                    <h2>Connecte-toi au FabLab</h2>
                    <p>Accède à ton espace et réserve tes créneaux en 2 minutes.</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Se connecter</button>
                    <button class="auth-tab" data-tab="signup">Créer un compte</button>
                </div>

                <form id="login-form" class="auth-form">
                    <label for="login-email">Adresse email</label>
                    <input type="email" id="login-email" required placeholder="prenom.nom@ecole.fr">

                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required placeholder="••••••••">

                    <p class="auth-error" id="login-error"></p>

                    <button type="submit" class="btn primary full">Se connecter</button>
                </form>

                <form id="signup-form" class="auth-form" hidden>
                    <div class="auth-row">
                        <div>
                            <label for="signup-prenom">Prénom</label>
                            <input type="text" id="signup-prenom" required placeholder="Alice">
                        </div>
                        <div>
                            <label for="signup-nom">Nom</label>
                            <input type="text" id="signup-nom" required placeholder="Dupont">
                        </div>
                    </div>

                    <label for="signup-classe">Classe</label>
                    <input type="text" id="signup-classe" placeholder="Ex : Terminale STI2D" required>

                    <label for="signup-email">Adresse email</label>
                    <input type="email" id="signup-email" required placeholder="prenom.nom@ecole.fr">

                    <label for="signup-password">Mot de passe</label>
                    <input type="password" id="signup-password" required minlength="6" placeholder="6 caractères minimum">

                    <p class="auth-error" id="signup-error"></p>

                    <button type="submit" class="btn primary full">Créer mon compte</button>
                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 FabLab — L'atelier de demain, dès aujourd'hui.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>

</body>
</html>
